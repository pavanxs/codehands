[package]
name = "codehands-apply-patch"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
codex-apply-patch = { path = "../../vendor/codex/codex-rs/apply-patch" }
codex-exec-server = { path = "../../vendor/codex/codex-rs/exec-server" }
codex-utils-path-uri = { path = "../../vendor/codex/codex-rs/utils/path-uri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "f69a4a0499f2fdc7d5d222df32373ffffe9ba3f5" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
